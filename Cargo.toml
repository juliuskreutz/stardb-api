[package]
name = "stardb-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
actix = "0.13.5"
actix-cors = "0.7.2"
actix-files = "0.7.0"
actix-multipart = "0.8.1"
actix-session = "0.11.0"
actix-web = "4.15.0"
anyhow = "1.0.104"
async-process = "2.5.0"
async-rwlock = "1.3.1"
base64 = "0.23.1"
brotli = "9.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dotenv = "0.15.0"
ed25519-dalek = { version = "3.0.0", features = ["pem", "rand_core"] }
envy = "0.4.2"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lazy_static = "1.5.0"
lettre = { version = "0.11.23", default-features = false, features = [
  "tokio1-rustls-tls",
  "builder",
  "smtp-transport",
] }
# Preserve secure PKCS#8 file I/O after ed25519-dalek removed its std feature.
pkcs8 = { version = "0.11.0", features = ["std"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
] }
rust-argon2 = "3.0.0"
sentry = { version = "0.49.2", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
] }
sentry-actix = "0.49.2"
sentry-tracing = "0.49.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "chrono",
  "json",
  "uuid",
  "runtime-tokio",
  "tls-rustls",
] }
strum = { version = "0.28.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "reqwest"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
webp = { version = "0.3.1", default-features = false }

# Keep useful backtraces while reducing local compile/link time and artifact size.
[profile.dev]
debug = "line-tables-only"

# Opt in to variable-level debugger information with --profile debugging.
[profile.debugging]
inherits = "dev"
debug = "full"
