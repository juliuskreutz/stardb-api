name: Deploy

on: workflow_dispatch

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1

      - name: Get Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Musl Tools
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: musl-tools
          version: 1.0

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
        env:
          SQLX_OFFLINE: true

      - name: Prepare
        run: mv target/x86_64-unknown-linux-musl/release/stardb-api .

      - name: Delete Old File
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: mv stardb-api/stardb-api stardb-api/stardb-api-old

      - name: Copy New File
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: stardb-api
          target: /root/stardb-api/

      - name: Restart Service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: systemctl restart stardb-api
