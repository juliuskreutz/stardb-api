name: Clippy

on:
  push:
  pull_request:

jobs:
  clippy:
    name: Offline check and Clippy
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check all targets without a database
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Check whitespace
        run: git diff --check
