name: Clippy

on:
  push:
  pull_request:

jobs:
  clippy:
    name: Offline Clippy
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Reuse dependency artifacts across runs; Clippy also type-checks all targets.
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check and lint all targets without a database
        run: cargo clippy --locked --all-targets
      - name: Check whitespace
        run: git diff --check
